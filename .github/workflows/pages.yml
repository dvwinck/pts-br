name: Publicar o site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verificar a especificação
        working-directory: tools
        run: |
          python3 build.py --render /tmp/03.md
          diff -q /tmp/03.md ../03-dicionario.md
          python3 check_spec.py --teste
          python3 check_spec.py --spec --falhar
          python3 sincronizar_plugin.py --verificar
      - name: Instalar o MkDocs
        run: pip install -r requirements-docs.txt
      - name: Gerar o site
        run: ./build-site.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Configuração do Vale para o PTS-BR.
# Repositório de equipe: o workflow tools/ci/docs-lint-equipe.yml obtém esta pasta de uma versão
# fixa da especificação. Para alterar as pastas de procedimentos, copie este arquivo para a raiz
# do repositório e escreva StylesPath = .pts-br/tools/vale.
# O Vale lê StylesPath em relação a este arquivo. O check_spec.py lê este arquivo com a opção
# --config (MinAlertLevel, StylesPath, as seções, BasedOnStyles e PTSBR.<Regra> = YES|NO|nível).
StylesPath = .
MinAlertLevel = suggestion
Vocab = PTSBR
# Negrito = rótulo de interface, valor de estado ou palavra de sinalização (R8.8): literal.
IgnoredScopes = code, tt, strong

[*.md]
BasedOnStyles = PTSBR
PTSBR.FraseLongaProcedimento = NO
# Mensagens de interface: apenas no modo check_spec.py --mensagens (05, seção 6.9).
PTSBR.Mensagens = NO

# Procedimentos e runbooks: limite de 20 palavras por frase (R4.2).
[docs/{procedimentos,runbooks}/**/*.md]
BasedOnStyles = PTSBR
PTSBR.FraseLonga = NO
PTSBR.FraseLongaProcedimento = YES
PTSBR.Mensagens = NO

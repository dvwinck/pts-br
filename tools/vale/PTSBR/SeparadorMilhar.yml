# R8.4 (Seção 8) — ponto como separador de milhar: "1.000", "10.000".
# Use espaço: "1 000", "10 000". Versões e IPs ficam em código (`2.100.3`).
# Também alerta antes da vírgula decimal: "R$ 1.500,00" -> "R$ 1 500,00".
extends: existence
message: "R8.4: '%s' usa ponto como separador de milhar. Use espaço ('10 000')."
level: warning
nonword: true
tokens:
  - '(?<![\p{L}\p{N}.,/-])\p{N}{1,3}(?:\.\p{N}{3})+(?!\.?\p{N})(?![\p{L}-])'
